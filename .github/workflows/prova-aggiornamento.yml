name: Prova aggiornamento

# Rifà solo la prova "una persona con la versione vecchia riceve e installa quella nuova",
# contro la versione già pubblicata sulla pagina di download, senza compilare né pubblicare niente.
on:
  workflow_dispatch:
    inputs:
      vecchia:
        description: 'Versione vecchia da cui partire (es. v1.0.75)'
        required: true
      nuova:
        description: 'Numero della versione pubblicata attesa (es. 78)'
        required: true

permissions:
  contents: read

jobs:
  aggiornamento:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Versione vecchia
        env:
          GH_TOKEN: ${{ github.token }}
          VECCHIA: ${{ inputs.vecchia }}
          NUOVA: ${{ inputs.nuova }}
        run: |
          [[ "$NUOVA" =~ ^[0-9]{1,4}$ ]] || { echo "::error::'nuova' deve essere solo il numero (es. 78)"; exit 1; }
          echo "NUOVA=$NUOVA" >> "$GITHUB_ENV"
          gh release download "$VECCHIA" -R "$GITHUB_REPOSITORY" -p CollezioneEuro.apk -O vecchia.apk

      - name: Accelerazione per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Strumenti per inviare la notifica di prova
        run: pip install --quiet --require-hashes -r scripts/requisiti-google.txt -r scripts/requisiti-prove.txt

      - name: Prova dell'aggiornamento dall'app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/test-emulator.py vecchia.apk prove-agg aggiornamento "$NUOVA"

      - name: Risultati come artifact (li mette sul ramo prove-aggiornamento un job a parte, con il permesso di scrittura)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: risultati-aggiornamento
          path: prove-agg
          if-no-files-found: ignore
          retention-days: 14

  # i risultati della prova dell'aggiornamento sul ramo prove-aggiornamento
  # (qui non gira codice di terzi: niente action dell'emulatore, niente pacchetti, nemmeno il checkout)
  salva:
    needs: [aggiornamento]
    if: ${{ !cancelled() && needs.aggiornamento.result != 'skipped' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: risultati-aggiornamento
          path: risultati
      - name: Risultati sui rami delle prove
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
          NUOVA: ${{ inputs.nuova }}
          VECCHIA: ${{ inputs.vecchia }}
        run: |
          errori=0
          # l'artifact viene da un job dove gira codice di terzi: niente di quello che contiene deve essere eseguito.
          # La cartella di git sta fuori dall'artifact (una .git dentro l'artifact git non la aggiunge mai), con hook
          # e fsmonitor spenti, e un artifact con collegamenti simbolici si scarta.
          salva() { # artifact, ramo, messaggio
            local dir="risultati/$1" gd="$RUNNER_TEMP/git-$2"
            [ -d "$dir" ] || { echo "Niente risultati per il ramo $2"; return 0; }
            [ -z "$(find "$dir" -type l -print -quit)" ] || { echo "::error::collegamenti simbolici nell'artifact $1: non lo salvo"; errori=1; return 0; }
            # una cartella .git dentro l'artifact (anche in una sottocartella) non deve diventare un rimando a un altro
            # repository né far fallire git add: si toglie, tanto i risultati sono solo file
            find "$dir" -name .git -prune -exec rm -rf {} +
            g() { git --git-dir="$gd" --work-tree="$dir" -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
            { g init -q -b "$2" && g add -A &&
              { g -c user.name=prova -c user.email=prova@users.noreply.github.com commit -qm "$3" || true; } &&
              g push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$2"; } || errori=1
          }
          salva risultati-aggiornamento prove-aggiornamento "Prova aggiornamento $VECCHIA -> $NUOVA"
          exit $errori
