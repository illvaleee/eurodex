name: Foto BCE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dipendenze
        run: npm install --no-audit --no-fund
      - name: Pagine BCE
        run: node scripts/fetch-ecb.mjs
      - name: Immagini
        run: if [ -f scripts/ecb-images.mjs ]; then node scripts/ecb-images.mjs; fi
      - name: Salva nel repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add scripts/ecb-cache www/data || true
          if git diff --cached --quiet; then echo "Niente di nuovo da salvare"; else git commit -m "Foto BCE ($(date +%F))" && git pull --rebase -X theirs -q origin main && git push; fi
