name: Server della sincronizzazione

# Il "postino" che avvisa gli altri dispositivi quando la collezione cambia (Firebase: database + funzione).
# Si installa da solo quando cambiano i file in firebase/, oppure a mano.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        'firebase/**',
        'prove/regole-accesso.py',
        'firebase.json',
        'scripts/firebase-prepara.py',
        'scripts/prova-sincronizzazione.py',
        'scripts/firebase-config.py',
        'scripts/requisiti-google.txt',
        '.github/workflows/sincronizzazione.yml',
      ]

permissions:
  contents: read

concurrency:
  group: sincronizzazione
  cancel-in-progress: false

jobs:
  installa:
    # tocca il server vero (regole, postino) e usa la chiave di Firebase: solo da main e con l'approvazione di Vale
    if: ${{ github.repository == 'illvaleee/eurodex' && github.ref == 'refs/heads/main' }}
    environment: pubblicazione
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # le impronte del certificato di firma si leggono dall'APK pubblicato (sono pubbliche: stanno in ogni APK),
      # così questo job non riceve mai la chiave di firma, che resta solo in firma-e-pubblica
      - name: Impronte della firma (dall'APK pubblicato, senza la chiave)
        id: impronte
        shell: bash
        run: |
          # impronta SHA-256 del certificato di Eurodex (pubblica): se l'APK della pagina di download non è firmato
          # con quello, ci si ferma invece di registrare in Firebase le impronte di un certificato estraneo
          ATTESA_SHA256='F5:34:07:14:09:EB:37:52:83:C2:CC:B7:CB:7D:C2:AC:C4:59:B4:FB:D1:0A:C7:26:30:F3:F5:73:0C:A9:2D:68'
          curl -fsSL https://raw.githubusercontent.com/illvaleee/collezione-euro-download/main/CollezioneEuro.apk -o "$RUNNER_TEMP/pubblicato.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERT=$("$BT/apksigner" verify --print-certs "$RUNNER_TEMP/pubblicato.apk")
          N=$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' <<< "$CERT" || true)
          [ "$N" = 1 ] || { echo "::error title=Impronte::l'APK pubblicato ha $N firmatari, ne serve uno solo"; exit 1; }
          SHA256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' <<< "$CERT")
          SHA1=$(sed -n 's/^Signer #1 certificate SHA-1 digest: *//p' <<< "$CERT")
          norm() { tr -d ': \n' | tr '[:lower:]' '[:upper:]'; }
          [ "$(norm <<< "$SHA256")" = "$(norm <<< "$ATTESA_SHA256")" ] \
            || { echo "::error title=Impronte::l'APK pubblicato non è firmato con il certificato di Eurodex: mi fermo"; exit 1; }
          [ -n "$SHA1" ] || { echo "::error title=Impronte::impronta SHA-1 non trovata nell'APK pubblicato"; exit 1; }
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/pubblicato.apk"
          echo "Impronte lette dall'APK pubblicato: la SHA-256 è quella di Eurodex"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # tutto quello che si scarica da fuori si installa PRIMA dei segreti, con versioni e impronte fisse
      - name: Strumenti (pacchetti Python e firebase-tools dai loro file con le versioni fisse)
        run: |
          pip install --quiet --require-hashes -r scripts/requisiti-google.txt
          (cd firebase/strumenti && npm ci --no-audit --no-fund --silent)
          (cd firebase/functions && npm ci --no-audit --no-fund --silent)
          firebase/strumenti/node_modules/.bin/firebase --version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # regole e postino si provano prima di pubblicarli, sugli emulatori e senza nessun segreto
      - name: Prove delle regole e del postino
        run: |
          node --test firebase/functions/logica.test.js
          firebase/strumenti/node_modules/.bin/firebase emulators:exec --only auth,firestore \
            --project collezione-euro-24ecd "python3 prove/regole-accesso.py"

      - name: Chiave di Firebase (fuori dal progetto)
        env:
          FIREBASE_INVIO_JSON: ${{ secrets.FIREBASE_INVIO_JSON }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/segreti"
          printf '%s' "$FIREBASE_INVIO_JSON" > "$RUNNER_TEMP/segreti/firebase.json"

      - name: Prepara Firebase (servizi, piano, database)
        run: FIREBASE_SA_FILE="$RUNNER_TEMP/segreti/firebase.json" python3 scripts/firebase-prepara.py

      - name: Accesso con Google (impronta dell'app e configurazione)
        # solo le impronte, lette prima dall'APK pubblicato: niente keystore e niente password accanto a google-auth
        env:
          IMPRONTA_SHA1: ${{ steps.impronte.outputs.sha1 }}
          IMPRONTA_SHA256: ${{ steps.impronte.outputs.sha256 }}
        run: FIREBASE_SA_FILE="$RUNNER_TEMP/segreti/firebase.json" python3 scripts/firebase-config.py

      - name: Regole del database e postino
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/segreti/firebase.json
        run: |
          # la prima volta Google impiega qualche minuto a dare i permessi ai suoi servizi interni: si riprova
          for i in 1 2 3 4; do
            if firebase/strumenti/node_modules/.bin/firebase deploy --only firestore:rules,firestore:indexes,functions --project collezione-euro-24ecd --non-interactive --force; then exit 0; fi
            echo "Non è andata, riprovo tra 2 minuti ($i/4)"; sleep 120
          done
          exit 1

      - name: Prova reale (come l'app)
        run: |
          sleep 20
          FIREBASE_SA_FILE="$RUNNER_TEMP/segreti/firebase.json" python3 scripts/prova-sincronizzazione.py

      - name: Via i file dei segreti
        if: always()
        run: rm -rf "$RUNNER_TEMP/segreti"
