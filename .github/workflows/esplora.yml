name: Esplorazione

# L'esploratore prova l'app come una persona (prove/esploratore.py). Qui si può lanciare a mano su una
# versione già pubblicata; prima di ogni pubblicazione lo lancia anche apk.yml sulla versione nuova.
on:
  workflow_dispatch:
    inputs:
      versione:
        description: 'Versione da esplorare (es. v1.0.78); vuoto = ultima pubblicata'
        required: false
      minuti:
        description: 'Minuti di esplorazione'
        required: false
        default: '30'

permissions:
  contents: read

jobs:
  esplora:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: App da esplorare
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONE: ${{ inputs.versione }}
        run: |
          if [ -n "$VERSIONE" ]; then
            gh release download "$VERSIONE" -R "$GITHUB_REPOSITORY" -p CollezioneEuro.apk -O app.apk
          else
            gh release download -R "$GITHUB_REPOSITORY" -p CollezioneEuro.apk -O app.apk
          fi
          ls -l app.apk

      - name: Accelerazione per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Strumenti, e minuti di esplorazione (solo un numero)
        env:
          MINUTI: ${{ inputs.minuti || '30' }}
        run: |
          pip install --quiet --require-hashes -r scripts/requisiti-prove.txt
          [[ "$MINUTI" =~ ^[0-9]{1,3}$ ]] || { echo "::error::minuti non validi: deve essere un numero"; exit 1; }
          echo "MINUTI=$MINUTI" >> "$GITHUB_ENV"

      - name: Esplorazione
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r app.apk && python3 prove/esploratore.py it.collezione.euro esplorazione "$MINUTI"

      - name: Risultati come artifact (li mette sul ramo esplorazione un job a parte, con il permesso di scrittura)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: risultati-esplorazione
          path: esplorazione
          if-no-files-found: ignore
          retention-days: 14

  # resoconto, diario e schermate sul ramo esplorazione
  # (qui non gira codice di terzi: niente action dell'emulatore, niente pacchetti, nemmeno il checkout)
  salva:
    needs: [esplora]
    if: ${{ !cancelled() && needs.esplora.result != 'skipped' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: risultati-esplorazione
          path: risultati
      - name: Risultati sui rami delle prove
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
          VERSIONE: ${{ inputs.versione || 'ultima' }}
        run: |
          errori=0
          # l'artifact viene da un job dove gira codice di terzi: niente di quello che contiene deve essere eseguito.
          # La cartella di git sta fuori dall'artifact (una .git dentro l'artifact git non la aggiunge mai), con hook
          # e fsmonitor spenti, e un artifact con collegamenti simbolici si scarta.
          salva() { # artifact, ramo, messaggio
            local dir="risultati/$1" gd="$RUNNER_TEMP/git-$2"
            [ -d "$dir" ] || { echo "Niente risultati per il ramo $2"; return 0; }
            [ -z "$(find "$dir" -type l -print -quit)" ] || { echo "::error::collegamenti simbolici nell'artifact $1: non lo salvo"; errori=1; return 0; }
            g() { git --git-dir="$gd" --work-tree="$dir" -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
            { g init -q -b "$2" && g add -A &&
              { g -c user.name=prova -c user.email=prova@users.noreply.github.com commit -qm "$3" || true; } &&
              g push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$2"; } || errori=1
          }
          salva risultati-esplorazione esplorazione "Esplorazione $VERSIONE"
          exit $errori
