name: Esplorazione

# L'esploratore prova l'app come una persona (prove/esploratore.py). Qui si può lanciare a mano su una
# versione già pubblicata; prima di ogni pubblicazione lo lancia anche apk.yml sulla versione nuova.
on:
  workflow_dispatch:
    inputs:
      versione:
        description: 'Versione da esplorare (es. v1.0.78); vuoto = ultima pubblicata'
        required: false
      minuti:
        description: 'Minuti di esplorazione'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  esplora:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: App da esplorare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.versione }}" ]; then
            gh release download "${{ inputs.versione }}" -R ${{ github.repository }} -p CollezioneEuro.apk -O app.apk
          else
            gh release download -R ${{ github.repository }} -p CollezioneEuro.apk -O app.apk
          fi
          ls -l app.apk

      - name: Accelerazione per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Strumenti
        run: pip install --quiet pillow

      - name: Esplorazione
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r app.apk && python3 prove/esploratore.py it.collezione.euro esplorazione ${{ inputs.minuti || '30' }}

      - name: 'Risultati sul ramo esplorazione (resoconto, diario e schermate)'
        if: ${{ always() }}
        run: |
          mkdir -p esplorazione && cd esplorazione
          git init -q -b esplorazione && git add -A
          git -c user.name=prova -c user.email=prova@users.noreply.github.com commit -qm "Esplorazione ${{ inputs.versione || 'ultima' }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" esplorazione
