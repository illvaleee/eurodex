name: Controllo link

# Apre tutti i collegamenti esterni che l'app può mostrare (BCE, Numista) e segnala quelli rotti.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-links.mjs
