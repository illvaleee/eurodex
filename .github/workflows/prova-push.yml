name: Prova notifiche push

# A mano (usa la chiave di Firebase, quindi con l'approvazione di Vale): su un telefono simulato con i servizi Google si
# controlla che la notifica immediata arrivi davvero (la notifica di prova va solo al telefono simulato, non a quelli
# veri).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    if: ${{ github.repository == 'illvaleee/eurodex' && github.ref == 'refs/heads/main' }}
    environment: pubblicazione
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ultima versione pubblicata (quella della pagina di download)
        run: curl -fsSL https://raw.githubusercontent.com/illvaleee/collezione-euro-download/main/CollezioneEuro.apk -o app.apk

      - name: Accelerazione per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # prima i pacchetti (versioni e impronte fisse), poi la chiave: pip non gira mai con la chiave su disco
      - name: Strumenti per la notifica
        run: pip install --quiet --require-hashes -r scripts/requisiti-google.txt

      - name: Chiave di Firebase (fuori dal progetto)
        env:
          FIREBASE_INVIO_JSON: ${{ secrets.FIREBASE_INVIO_JSON }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/segreti"
          printf '%s' "$FIREBASE_INVIO_JSON" > "$RUNNER_TEMP/segreti/firebase.json"
          echo "FIREBASE_SA_FILE=$RUNNER_TEMP/segreti/firebase.json" >> "$GITHUB_ENV"

      # l'action dell'emulatore gira con la chiave di Firebase su disco (serve alla prova): per questo è fissata a un
      # commit preciso e non a un'etichetta che si può spostare
      - name: Prova della notifica immediata
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/prova-push-emulatore.py app.apk prove-push

      - name: Risultati come artifact (li mette sul ramo prove-push un job a parte, con il permesso di scrittura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-push
          path: prove-push
          if-no-files-found: ignore
          retention-days: 14

      - name: Via i file dei segreti
        if: always()
        run: rm -rf "$RUNNER_TEMP/segreti"

  # i risultati della prova sul ramo prove-push
  # (qui non gira codice di terzi: niente action dell'emulatore, niente pacchetti, nemmeno il checkout)
  salva:
    needs: [prova]
    if: ${{ !cancelled() && needs.prova.result != 'skipped' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: risultati-push
          path: risultati
      - name: Risultati sui rami delle prove
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          errori=0
          salva() { # artifact, ramo, messaggio
            [ -d "risultati/$1" ] || { echo "Niente risultati per il ramo $2"; return 0; }
            (cd "risultati/$1" && git init -q -b "$2" && git add -A &&
              { git -c user.name=prova -c user.email=prova@users.noreply.github.com commit -qm "$3" || true; } &&
              git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$2") || errori=1
          }
          salva risultati-push prove-push "Prova push $N"
          exit $errori
