name: Prova notifiche push

# A mano (usa la chiave di Firebase, quindi con l'approvazione di Vale): su un telefono simulato con i servizi Google si
# controlla che la notifica immediata arrivi davvero (la notifica di prova va solo al telefono simulato, non a quelli
# veri).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    if: ${{ github.repository == 'illvaleee/eurodex' && github.ref == 'refs/heads/main' }}
    environment: pubblicazione
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Ultima versione pubblicata (quella della pagina di download)
        run: curl -fsSL https://raw.githubusercontent.com/illvaleee/collezione-euro-download/main/CollezioneEuro.apk -o app.apk

      - name: Accelerazione per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Chiave di Firebase (fuori dal progetto) e strumenti per la notifica
        env:
          FIREBASE_INVIO_JSON: ${{ secrets.FIREBASE_INVIO_JSON }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/segreti"
          printf '%s' "$FIREBASE_INVIO_JSON" > "$RUNNER_TEMP/segreti/firebase.json"
          pip install --quiet google-auth requests
          echo "FIREBASE_SA_FILE=$RUNNER_TEMP/segreti/firebase.json" >> "$GITHUB_ENV"

      - name: Prova della notifica immediata
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/prova-push-emulatore.py app.apk prove-push

      - name: Salva i risultati
        if: always()
        run: |
          mkdir -p prove-push && cd prove-push
          git init -q -b prove-push && git add -A
          git -c user.name=prova -c user.email=prova@users.noreply.github.com commit -qm "Prova push ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prove-push

      - name: Via i file dei segreti
        if: always()
        run: rm -rf "$RUNNER_TEMP/segreti"
